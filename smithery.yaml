# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - esHost
    properties:
      esHost:
        type: string
        description: Your Elasticsearch 7.x instance URL, or several separated by commas (or legacy HOST)
      esApiKey:
        type: string
        description: Your Elasticsearch API key for authentication (or legacy API_KEY)
      esUsername:
        type: string
        description: Elasticsearch username for basic authentication (optional, or
          legacy USERNAME)
      esPassword:
        type: string
        description: Elasticsearch password for basic authentication (optional, or
          legacy PASSWORD)
      esCaCert:
        type: string
        description: Path to custom CA certificate for ES SSL/TLS (optional, or legacy
          CA_CERT)
      esOauthTokenUrl:
        type: string
        description: OAuth2 token endpoint. Setting it enables OAuth2, which then
          takes precedence over the API key and basic auth. Must be https, except
          for localhost.
      esOauthClientId:
        type: string
        description: OAuth2 client id (required once the token URL is set)
      esOauthClientSecret:
        type: string
        description: OAuth2 client secret (required once the token URL is set)
      esOauthScope:
        type: string
        description: Scope to request, if the provider needs one
      esOauthAudience:
        type: string
        description: Audience to request, which Auth0 needs to issue a JWT
      esOauthAuthStyle:
        type: string
        enum:
          - post
          - basic
        description: Send the client credentials in the form body (post, the
          default) or in an HTTP Basic header (basic)
      esRequestTimeout:
        type: number
        default: 30000
        description: Per-request timeout in milliseconds. Raise it if aggregations
          over many indices time out.
      esMaxRetries:
        type: number
        default: 3
        description: Retries per request. 0 disables them.
      esMaxResultBytes:
        type: number
        default: 32768
        description: Ceiling on one tool result. Past it, detail sections are
          omitted and the result says so.
      esInstanceLabel:
        type: string
        description: Free-text name of this deployment, e.g. production or staging.
          Becomes the server title, so several instances are distinguishable.
      esAdminTools:
        type: boolean
        default: false
        description: Expose the read-only diagnostic tools (shard allocation, cat
          shards and nodes, index and cluster settings, index stats, task list).
          Safe in production - they only read - but they enlarge the tool list.
      esAllowDestructive:
        type: boolean
        default: false
        description: Expose the irreversible tools (delete_index, delete_document,
          delete_by_query, delete_index_template). Leave false in production.
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => {
      // Use provided config or fallback to legacy environmental variables names
      const env = {
        ES_HOST: config.esHost,
        ES_API_KEY: config.esApiKey || '',
        ES_USERNAME: config.esUsername || '',
        ES_PASSWORD: config.esPassword || '',
        ES_CA_CERT: config.esCaCert || '',
        ES_INSTANCE_LABEL: config.esInstanceLabel || '',
        // OAuth2. The token URL is what switches the factor on, and a partial
        // block is refused by the server at startup rather than falling back to
        // another identity — so passing these through empty is safe.
        ES_OAUTH_TOKEN_URL: config.esOauthTokenUrl || '',
        ES_OAUTH_CLIENT_ID: config.esOauthClientId || '',
        ES_OAUTH_CLIENT_SECRET: config.esOauthClientSecret || '',
        ES_OAUTH_SCOPE: config.esOauthScope || '',
        ES_OAUTH_AUDIENCE: config.esOauthAudience || '',
        ES_OAUTH_AUTH_STYLE: config.esOauthAuthStyle || '',
        // Empty string rather than a repeated default: the server's zod schema
        // owns each default, and duplicating them here is how the two drift.
        ES_REQUEST_TIMEOUT: config.esRequestTimeout ? String(config.esRequestTimeout) : '',
        ES_MAX_RETRIES: config.esMaxRetries !== undefined ? String(config.esMaxRetries) : '',
        ES_MAX_RESULT_BYTES: config.esMaxResultBytes ? String(config.esMaxResultBytes) : '',
        // Absent or anything other than "true"/"1" means off; the server only
        // registers a gated tool when the flag is explicitly on.
        ES_ADMIN_TOOLS: config.esAdminTools ? 'true' : 'false',
        ES_ALLOW_DESTRUCTIVE: config.esAllowDestructive ? 'true' : 'false'
      };
      return {
        command: 'node',
        args: ['dist/index.js'],
        env
      };
    }
  exampleConfig:
    esHost: http://localhost:9200
    esApiKey: your-api-key-here
    esUsername: user
    esPassword: password
    esCaCert: /path/to/ca.crt
    esInstanceLabel: production
    esRequestTimeout: 60000
    esMaxResultBytes: 32768
    esAdminTools: true
    esAllowDestructive: false
